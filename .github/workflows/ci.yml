name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Provision job-owned test scratch
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}" "${GITHUB_ENV:?GITHUB_ENV is required}"
          case "$RUNNER_TEMP$GITHUB_ENV" in
            *$'\n'*|*$'\r'*) printf 'Invalid runner path\n' >&2; exit 1 ;;
          esac
          case "$RUNNER_OS" in
            Linux) root="$RUNNER_TEMP" ;;
            Windows) root="$(cygpath -u "$RUNNER_TEMP")" ;;
            *) printf 'Unsupported runner OS\n' >&2; exit 1 ;;
          esac
          case "$root" in
            /) exit 1 ;;
            /*) ;;
            *) printf 'RUNNER_TEMP must be absolute\n' >&2; exit 1 ;;
          esac
          test -d "$root"
          test ! -L "$root"
          test -w "$root"
          test -f "$GITHUB_ENV"
          test -w "$GITHUB_ENV"
          root="$(cd -- "$root" && pwd -P)"
          scratch="$(mktemp -d "$root/hermes-tests.XXXXXXXX")"
          mkdir -- "$scratch/tmp"
          scratch="$scratch/tmp"
          if [ "$RUNNER_OS" = Windows ]; then
            scratch="$(cygpath -m "$scratch")"
          fi
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$scratch" "$scratch" "$scratch" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-memory-${{ matrix.os }}
          path: |
            target/release/hermes-memory
            target/release/hermes-memory.exe
          if-no-files-found: error

  python:
    name: Python plugin and installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: .hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install pytest pyyaml ruamel.yaml==0.18.17
      - run: cargo build --locked
      - run: python -m pytest python_tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}/.hermes-agent
