name: Windows broker small case (disposable only)

# Future CI only: source preflight is NOT workflow review or dispatch approval.
# Independently review this workflow before publishing or acknowledging below.
on:
  push:
    branches: [test/posix-sqlite-hardening]
    paths: ['.github/workflows/windows-broker-benchmark.yml']
  workflow_dispatch:
    inputs:
      case:
        description: 'Disposable 6 MiB only; pilot correctness is not performance acceptance'
        type: choice
        required: true
        default: small
        options: [small, representative-small-pilot, representative-two-warmup, representative-full6]
      reviewed:
        description: 'Independent source AND workflow review completed; disposable 6 MiB only'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  register:
    if: github.event_name == 'push' && github.ref == 'refs/heads/test/posix-sqlite-hardening'
    runs-on: windows-2022
    timeout-minutes: 2
    steps:
      - name: Register manual workflow without running the benchmark
        shell: pwsh
        run: Write-Output 'Registration only; benchmark requires a separate reviewed manual dispatch.'
  small:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/posix-sqlite-hardening' && inputs.reviewed == true
    env:
      BENCHMARK_CASE: ${{ inputs.case }}
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify native hosted gates and reviewed source provenance
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          evidence = root / 'target/ci-small-raw'
          evidence.mkdir(parents=True, exist_ok=False)
          provenance = {'schema': 1, 'requested_case': os.environ.get('BENCHMARK_CASE'), 'gate_pass': False}
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          try:
              if os.environ.get('BENCHMARK_CASE') not in ('small', 'representative-small-pilot', 'representative-two-warmup', 'representative-full6'):
                  raise RuntimeError('Unsupported benchmark case; only disposable 6 MiB allowed')
              expected = {
                  'GITHUB_ACTIONS': 'true', 'RUNNER_ENVIRONMENT': 'github-hosted',
                  'RUNNER_OS': 'Windows', 'ImageOS': 'win22',
                  'GITHUB_EVENT_NAME': 'workflow_dispatch',
                  'GITHUB_REF': 'refs/heads/test/posix-sqlite-hardening',
              }
              # Observe runner-provided values; NEVER assign hosted-gate variables.
              provenance['host'] = {key: os.environ.get(key) for key in expected}
              for key, value in expected.items():
                  if os.environ.get(key) != value:
                      raise RuntimeError(f'Hosted gate rejected {key}')
              def git(*args):
                  return subprocess.check_output(['git', *args], text=True, timeout=15).strip()
              provenance['commit'] = git('rev-parse', 'HEAD')
              if provenance['commit'] != os.environ['GITHUB_SHA']:
                  raise RuntimeError('Checkout differs from dispatched commit')
              # This reviewed source has none of these build-input overrides.
              for name in ('.cargo', 'build.rs', 'rust-toolchain', 'rust-toolchain.toml'):
                  if (root / name).exists():
                      raise RuntimeError(f'Unreviewed build override: {name}')
              paths = sorted([p.relative_to(root).as_posix()
                              for folder in ('src', 'examples')
                              for p in (root / folder).rglob('*') if p.is_file()]
                             + ['Cargo.toml', 'Cargo.lock', 'scripts/__init__.py',
                                'scripts/windows_broker_full8_validator.py',
                                'python_tests/test_windows_broker_full8_validator.py'])
              if any((root / p).is_symlink() for p in paths):
                  raise RuntimeError('Source symlink refused')
              inventory = [{'path': p, 'sha256': digest(root / p)} for p in paths]
              provenance['source_files'] = inventory
              source_digest = hashlib.sha256(json.dumps(inventory, separators=(',', ':')).encode()).hexdigest()
              provenance['source_sha256'] = source_digest
              # Frozen minimal full64 build-input inventory; NOT inherited approval.
              # This exact combined source/workflow requires independent review.
              if source_digest != '38ee993d29de935122f9427c05a556ba34d8d4a1fc2845e8dc0419867684e698':
                  raise RuntimeError('Build inputs differ from frozen full64 snapshot')
              provenance['workflow_sha256'] = digest(root / '.github/workflows/windows-broker-benchmark.yml')
              # Diagnostic admission only; runtime correctness is not release approval.
              if os.environ.get('BENCHMARK_CASE') != 'representative-full6':
                  raise RuntimeError('Diagnostic Schema8 admission permits representative-full6 only')
              provenance['gate_pass'] = True
          except Exception as error:
              provenance['error'] = str(error)[:4096]
              raise
          finally:
              (evidence / 'provenance.json').write_text(json.dumps(provenance, indent=2), encoding='utf-8')

      - uses: dtolnay/rust-toolchain@stable

      - name: Build actual release executables with locked dependencies
        timeout-minutes: 18
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          cargo build --locked --release --features experimental-broker --example windows_broker_benchmark --bin hermes-memory-admin --bin hermes-memory-broker --bin hermes-memory-client
          $originalExit = $LASTEXITCODE
          try {
            @{ schema = 1; exit_code = $originalExit } | ConvertTo-Json | Set-Content -Encoding utf8 target/ci-small-raw/build-status.json
          } catch {
            Write-Warning 'Could not persist build status'
            if ($originalExit -eq 0) { exit 1 }
          }
          exit $originalExit

      - name: Run selected disposable 6 MiB case with bounded direct-child supervision
        timeout-minutes: 12
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, sys, threading, time
          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root))
          evidence = root / 'target/ci-small-raw'
          result_path = evidence / 'result.json'
          stream_limit = 1024 * 1024
          result_limit = 16 * 1024 * 1024
          deadline_seconds = 600
          status = {'schema': 1, 'requested_case': os.environ.get('BENCHMARK_CASE'), 'child_exit_code': None,
                    'timed_out': False, 'validated': False, 'deadline_seconds': deadline_seconds,
                    'cleanup': 'Harness-owned services only; fixtures retained for hosted VM disposal'}
          code = 1
          child = None
          threads = []
          captures = {name: {'bytes': bytearray(), 'eof': False, 'overflow': False, 'error': None}
                      for name in ('stdout', 'stderr')}
          lock = threading.Lock()
          bad_capture = threading.Event()
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          def verify_source(root, provenance):
              paths = sorted([p.relative_to(root).as_posix()
                              for folder in ('src', 'examples')
                              for p in (root / folder).rglob('*') if p.is_file()]
                             + ['Cargo.toml', 'Cargo.lock', 'scripts/__init__.py',
                                'scripts/windows_broker_full8_validator.py',
                                'python_tests/test_windows_broker_full8_validator.py'])
              require(not any((root / p).is_symlink() for p in paths), 'Source symlink refused')
              for name in ('.cargo', 'build.rs', 'rust-toolchain', 'rust-toolchain.toml'):
                  require(not (root / name).exists(), 'Unreviewed build override')
              inventory = [{'path': p, 'sha256': hashlib.sha256((root / p).read_bytes()).hexdigest()} for p in paths]
              digest = hashlib.sha256(json.dumps(inventory, separators=(',', ':')).encode()).hexdigest()
              require(exact_equal(inventory, provenance['source_files']) and digest == provenance['source_sha256'], 'Build source changed since pinned preflight')
              return digest
          def selected_case(value):
              require(value in ('small', 'representative-small-pilot', 'representative-two-warmup', 'representative-full6'), 'Unsupported 6 MiB case')
              return value
          def exact_equal(left, right):
              # Python structural equality aliases bool/int/float; preserve JSON representation.
              return left == right and json.dumps(left, sort_keys=True, separators=(',', ':')) == json.dumps(right, sort_keys=True, separators=(',', ':'))
          def uint(value):
              return type(value) is int and 0 <= value <= 18446744073709551615
          def sha(value):
              return isinstance(value, str) and len(value) == 64 and all(c in '0123456789abcdef' for c in value)
          def logical_io(value):
              keys = {'read_operations', 'write_operations', 'other_operations', 'read_bytes', 'write_bytes', 'other_bytes'}
              require(isinstance(value, dict) and set(value) == keys and all(uint(v) for v in value.values()), 'Logical IO schema')
          def process_sample(value):
              fields = {'logical_io', 'private_bytes', 'working_set_bytes', 'lifetime_peak_private_bytes', 'lifetime_peak_working_set_bytes'}
              require(isinstance(value, dict) and set(value) == fields, 'Process sample fields')
              logical_io(value['logical_io'])
              for key in ('private_bytes', 'working_set_bytes', 'lifetime_peak_private_bytes', 'lifetime_peak_working_set_bytes'):
                  require(uint(value[key]), 'Process memory schema')
          def validate_measurement(m, payload_bytes, operation_id=0):
              # Mirrors the current Rust schema, including explicitly missing coverage.
              fields = 'schema identity operation_id payload_bytes command_success child_exit_us live_attempts live_samples exit_races live_errors first_live_error first_sample_us last_sample_us max_sample_gap_us memory timepoints omitted_timepoints final_lifetime_logical_io final_io_error'.split()
              require(isinstance(m, dict) and set(m) == set(fields), 'CLI measurement fields')
              require(type(m['schema']) is int and m['schema'] == 2 and type(m['operation_id']) is int and m['operation_id'] == operation_id, 'CLI schema/operation')
              require(exact_equal(m['identity'], {'role': 'cli-child', 'epoch': 3 + operation_id}) and type(m['identity']['epoch']) is int, 'CLI retained epoch')
              require(uint(m['payload_bytes']) and m['payload_bytes'] == payload_bytes and m['command_success'] is True, 'CLI payload/success')
              for key in ('child_exit_us', 'live_attempts', 'live_samples', 'exit_races', 'live_errors', 'max_sample_gap_us', 'omitted_timepoints'):
                  require(uint(m[key]), 'CLI numeric metadata')
              require(m['live_attempts'] == m['live_samples'] + m['exit_races'] + m['live_errors'], 'CLI attempt accounting')
              points = m['timepoints']
              require(isinstance(points, list) and len(points) <= 12 and len(points) + m['omitted_timepoints'] == m['live_samples'], 'CLI retained point accounting')
              has_samples = m['live_samples'] > 0
              require(has_samples == bool(points), 'CLI live samples require retained prefix')
              require((points[0]['since_spawn_start_us'] if points else None) == m['first_sample_us'], 'CLI first retained timestamp')
              for key in ('memory', 'first_sample_us', 'last_sample_us'):
                  require((m[key] is not None) == has_samples, 'CLI missing coverage must remain null')
              require((m['first_live_error'] is not None) == (m['live_errors'] > 0), 'CLI live error accounting')
              for key in ('first_live_error', 'final_io_error'):
                  require(m[key] is None or (isinstance(m[key], str) and len(m[key].encode()) <= 2048), 'CLI error bound')
              final_io = m['final_lifetime_logical_io']
              if final_io is not None:
                  logical_io(final_io)
                  require(m['final_io_error'] is None, 'CLI final IO with error')
              if has_samples:
                  require(uint(m['first_sample_us']) and uint(m['last_sample_us']) and m['first_sample_us'] <= m['last_sample_us'] <= m['child_exit_us'], 'CLI sample times')
                  memory_keys = ('sampled_private_bytes', 'sampled_working_set_bytes', 'observed_lifetime_peak_private_bytes', 'observed_lifetime_peak_working_set_bytes')
                  require(isinstance(m['memory'], dict) and set(m['memory']) == set(memory_keys) and all(uint(v) for v in m['memory'].values()), 'CLI memory schema')
              previous = None
              retained_gap = 0
              for point in points:
                  require(isinstance(point, dict) and set(point) == {'since_spawn_start_us', 'logical_io', 'private_bytes', 'working_set_bytes', 'lifetime_peak_private_bytes', 'lifetime_peak_working_set_bytes'}, 'CLI timepoint fields')
                  process_sample({k: v for k, v in point.items() if k != 'since_spawn_start_us'})
                  t = point['since_spawn_start_us']
                  require(uint(t) and m['first_sample_us'] <= t <= m['last_sample_us'], 'CLI timepoint coverage')
                  if previous is not None:
                      retained_gap = max(retained_gap, t - previous['since_spawn_start_us'])
                      require(t >= previous['since_spawn_start_us'] and all(point['logical_io'][k] >= previous['logical_io'][k] for k in point['logical_io']), 'CLI counter/time regression')
                  if final_io is not None:
                      require(all(final_io[k] >= point['logical_io'][k] for k in final_io), 'CLI final counter regression')
                  for maximum, field in zip(memory_keys, ('private_bytes', 'working_set_bytes', 'lifetime_peak_private_bytes', 'lifetime_peak_working_set_bytes')):
                      require(m['memory'][maximum] >= point[field], 'CLI sampled maximum regression')
                  previous = point
              require(m['max_sample_gap_us'] >= retained_gap and (m['omitted_timepoints'] != 0 or m['max_sample_gap_us'] == retained_gap), 'CLI retained cadence mismatch')
          def command_group(group, expected):
              require(isinstance(group, list) and len(group) == len(expected), 'Missing/extra command evidence')
              for command, label in zip(group, expected):
                  # Current wire format carries the label through stdout_file, not a label field.
                  filename = command['stdout_file'].replace('\\', '/').rsplit('/', 1)[-1]
                  require(filename == label + '.stdout', 'Command order/identity')
                  require(all(command.get(k) is True for k in ('capture_complete', 'child_exited')), 'Incomplete nested capture')
                  require(all(command.get(k) is False for k in ('timed_out', 'stop_requested', 'stdout_overflow', 'stderr_overflow')), 'Nested deadline/capture exceeded')
                  require(all(k in command and command[k] is None for k in ('spawn_error', 'capture_error', 'kill_error', 'wait_error')), 'Nested infrastructure error')
                  require(type(command.get('exit_code')) is int, 'Missing command exit')
                  if label in ('wrong-workspace', 'wrong-root', 'wrong-server-pin'):
                      require(command['exit_code'] != 0 and command.get('success') is False and 'unauthorized' in command['stderr'], 'Missing explicit denial')
                  else:
                      require(command['exit_code'] == 0 and command.get('success') is True, 'Command failed')
              return dict(zip(expected, group))
          def warmup_record(id):
              return {'id': f'benchmark-workload-v1-{id:06}', 'session_id': 'benchmark-client', 'workspace': 'disposable-benchmark', 'kind': 'user', 'content': f'deterministic warmup {id:06} ' * 64, 'timestamp': 1710000000.0 + id, 'metadata': {'operation_id': id, 'workload': 'two-warmup-v1'}}
          def validate_two_warmup(report, commands):
              client, metrics = report['client'], report['metrics']
              epoch = report['fixture']['client_service']
              require(isinstance(epoch, str) and 1 <= len(epoch.encode()) <= 256, 'Two-warmup case epoch')
              require(client.get('case') == report['case'], 'Client case mismatch')
              for obj in (report['generation'], report['startup_import']['persisted_startup_receipt'], report['startup_import']['final_read_only_export']):
                  require(all(uint(obj[k]) for k in ('records', 'snapshot_states', 'snapshot_counters')), 'Two-warmup strict oracle counts')
              require(16 <= report['generation']['seed_records'] <= 400000 and uint(client['export']['records']) and uint(client['export']['sessions']), 'Two-warmup count bounds')
              for value in (report['client_stop']['process']['exit_code'], report['client_stop']['scm_exit_code'], report['broker_exit']['exit_code'], report['broker_after']['pinned_process']['exit_code']):
                  require(type(value) is int and value == 0, 'Two-warmup strict clean exit')
              receipt = client['two_warmup']
              require(set(receipt) == {'schema', 'case_epoch', 'expected_additions', 'sampling_complete', 'full_workload_complete', 'performance_policy_status'} and type(receipt['schema']) is int and receipt['schema'] == 4 and receipt['case_epoch'] == epoch and type(receipt['expected_additions']) is int and receipt['expected_additions'] == 2, 'Two-warmup client receipt')
              for obj in (metrics, receipt):
                  require(obj.get('sampling_complete') is False and obj.get('full_workload_complete') is False and obj.get('performance_policy_status') == 'unapproved', 'Two-warmup incomplete/unapproved')
              require(all(obj.get('performance_complete', False) is False for obj in (report, client, metrics, receipt)), 'Unapproved performance claim')
              require(metrics.get('measured') is True and metrics.get('native_handle_verified') is True and metrics.get('warmups_complete') is True and type(metrics.get('expected_warmups')) is int and metrics['expected_warmups'] == 2, 'Two-warmup native coverage')
              require(exact_equal(report['generation']['fixture_spec'], {'shape': 'representative-v2', 'target_jsonl_bytes': 6291456}), 'Two-warmup fixture spec; no large case')
              native, operations = metrics['native_intervals'], metrics['operations']
              require(isinstance(native, list) and isinstance(operations, list) and len(native) == len(operations) == 2, 'Exactly two ordered operations')
              measured = [c for c in client['commands'] if 'measurement' in c]
              require(exact_equal(measured, [commands['warmup-op-0'], commands['warmup-op-1']]), 'Exactly two ordered measured CLI commands')
              retained = metrics['controller_retained_receipts']
              require(isinstance(retained, list) and len(retained) == 2 and exact_equal(measured, retained), 'Final commands differ from exact controller-retained receipts')
              for command in report['commands'] + client['commands']:
                  if 'elapsed_us' in command:
                      require(uint(command['elapsed_us']), 'Command duration schema')
              previous_projection = None
              previous_after = None
              for id, (interval, op, command) in enumerate(zip(native, operations, measured)):
                  require(set(interval) == {'operation_id', 'before_release', 'after_done', 'receipt_validated', 'projection'}, 'Native interval fields')
                  require(set(op) == {'operation_id', 'cli_epoch', 'payload_bytes', 'before_release', 'after_done', 'receipt_validated', 'exact_append_verified', 'hashing'}, 'Operation receipt fields')
                  for obj in (interval, op):
                      require(type(obj['operation_id']) is int and obj['operation_id'] == id and obj['receipt_validated'] is True, 'Operation order/receipt; no future ACK')
                  require(op['exact_append_verified'] is True and op['hashing'] == 'outside bracket' and type(op['cli_epoch']) is int and op['cli_epoch'] == 3 + id, 'Operation append/CLI epoch')
                  record = warmup_record(id)
                  payload = len(json.dumps([record], separators=(',', ':')).encode())
                  require(uint(op['payload_bytes']) and op['payload_bytes'] == payload, 'Operation exact stdin bytes')
                  ack = json.loads(command['stdout'])
                  require(isinstance(ack, dict) and ack == {'inserted': 1, 'duplicates': 0} and all(uint(v) for v in ack.values()), 'Warmup exact acknowledgement')
                  validate_measurement(command['measurement'], payload, id)
                  for stream in ('stdout', 'stderr'):
                      require(command[stream + '_file'].replace('\\', '/').rsplit('/', 1)[-1] == f'warmup-op-{id}.{stream}', 'Warmup capture correlation')
                  a, b = interval['before_release'], interval['after_done']
                  require(exact_equal(op['before_release'], a) and exact_equal(op['after_done'], b), 'Native/operation receipt correlation')
                  for boundary, after in ((a, False), (b, True)):
                      fields = {'case_epoch', 'operation_id', 'broker_epoch', 'supervisor_epoch', 'cli_epoch', 'broker', 'supervisor'}
                      if after:
                          fields |= {'broker_logical_io_delta', 'supervisor_logical_io_delta', 'handshake_span_us'}
                      require(set(boundary) == fields and boundary['case_epoch'] == epoch, 'Native boundary fields/case')
                      for key, expected in (('operation_id', id), ('broker_epoch', 1), ('supervisor_epoch', 2), ('cli_epoch', 3 + id)):
                          require(type(boundary[key]) is int and boundary[key] == expected, 'Native retained epochs/order')
                  require(uint(b['handshake_span_us']), 'Native interval duration')
                  for role in ('broker', 'supervisor'):
                      process_sample(a[role])
                      process_sample(b[role])
                      delta = b[role + '_logical_io_delta']
                      logical_io(delta)
                      require(all(b[role]['logical_io'][k] >= a[role]['logical_io'][k] and delta[k] == b[role]['logical_io'][k] - a[role]['logical_io'][k] for k in delta), 'Checked native IO delta')
                      if previous_after is not None:
                          require(all(a[role]['logical_io'][k] >= previous_after[role]['logical_io'][k] for k in delta), 'Same retained handle cross-operation counters')
                  projection = interval['projection']
                  require(set(projection) == {'same_identity', 'before_bytes', 'after_bytes', 'volume_serial_number', 'file_id'} and projection['same_identity'] is True, 'Native projection identity')
                  require(uint(projection['before_bytes']) and uint(projection['after_bytes']) and 6291456 <= projection['before_bytes'] < projection['after_bytes'] <= 8388608 and projection['after_bytes'] - projection['before_bytes'] == payload - 1, 'Exact append range/record newline')
                  require(uint(projection['volume_serial_number']) and isinstance(projection['file_id'], list) and len(projection['file_id']) == 16 and all(uint(v) and v <= 255 for v in projection['file_id']), 'Native file identity schema')
                  if previous_projection is not None:
                      require(exact_equal(projection['before_bytes'], previous_projection['after_bytes']) and all(exact_equal(projection[k], previous_projection[k]) for k in ('volume_serial_number', 'file_id')), 'Cross-operation projection identity/range')
                  previous_projection, previous_after = projection, b
              stage = metrics['warmup_commands']
              require(isinstance(stage, dict) and set(stage) == set('schema stage sample_count expected_count commands_successful benchmark_correctness_verified logical_io_complete sampled_memory_available child_exit_us logical_io samples performance_policy_status io_scope memory_scope latency_scope timepoint_retention supervision_scope'.split()), 'Closed actual schema2 stage')
              require(type(stage['schema']) is int and stage['schema'] == 2 and stage['stage'] == 'warmup' and type(stage['sample_count']) is int and stage['sample_count'] == 2 and type(stage['expected_count']) is int and stage['expected_count'] == 2 and stage['commands_successful'] is True and stage['benchmark_correctness_verified'] is False and stage['performance_policy_status'] == 'unapproved' and exact_equal(stage['samples'], [c['measurement'] for c in measured]), 'Actual schema2 warmup stage totals/receipts')
              require(stage['logical_io_complete'] is all(c['measurement']['final_lifetime_logical_io'] is not None and c['measurement']['final_io_error'] is None for c in measured) and stage['sampled_memory_available'] is all(c['measurement']['live_samples'] > 0 and c['measurement']['live_errors'] == 0 for c in measured), 'Warmup coverage totals')
              def statistics(values):
                  values = sorted(values)
                  if not values:
                      return None
                  return {'count': len(values), 'p50': values[(len(values) * 50 + 99) // 100 - 1], 'p95': values[(len(values) * 95 + 99) // 100 - 1], 'worst': values[-1]}
              def check_statistics(actual, values):
                  require(exact_equal(actual, statistics(values)) and (actual is None or (isinstance(actual, dict) and all(uint(v) for v in actual.values()))), 'Warmup checked statistics')
              samples = stage['samples']
              check_statistics(stage['child_exit_us'], [m['child_exit_us'] for m in samples])
              io_keys = {'read_operations', 'write_operations', 'other_operations', 'read_bytes', 'write_bytes', 'other_bytes'}
              require(isinstance(stage['logical_io'], dict) and set(stage['logical_io']) == io_keys, 'Stage logical IO fields')
              for key in io_keys:
                  check_statistics(stage['logical_io'][key], [m['final_lifetime_logical_io'][key] for m in samples if m['final_lifetime_logical_io'] is not None])
              startup = report['startup_import']
              require(sha(startup['expected_final_logical_sha256']) and startup['expected_final_logical_sha256'] == startup['final_read_only_export']['logical_sha256'], 'Independent final SQLite oracle')
              final = report['final_payloads']
              require(final['exact_records_including_metadata_verified'] is True and uint(final['records']) and final['records'] == report['generation']['seed_records'] + 3 and uint(final['bytes']) and final['bytes'] == previous_projection['after_bytes'] and final['bytes'] <= 8388608 and final['verification'] == 'post-stop, sequential streaming, outside measurement', 'Final exact JSONL oracle')
              return {'correctness_pass': True, 'measurement_status': 'incomplete-two-warmup', 'sampling_complete': False, 'full_workload_complete': False, 'performance_policy_status': 'unapproved', 'performance_complete': False}
          def closed(value, fields, context):
              require(type(value) is dict and set(value) == set(fields.split()), context + ' closed fields')
          def full_descriptor(id):
              # Mirror the pinned Full20x256V1 producer, including JSON-array stdin vs JSONL.
              source = id - 20 if 42 <= id < 62 else id
              first, count = (source, 1) if source < 22 else (22 + (source - 22) * 256, 256) if source < 42 else (0, 0)
              records = []
              for ordinal in range(first, first + count):
                  text = f'ordinary full20x256-v1 mutation {ordinal:06} '
                  records.append({'id': f'benchmark-full20x256-v1-{ordinal:06}', 'session_id': 'benchmark-client', 'workspace': 'disposable-benchmark', 'kind': 'user', 'content': (text * (2048 // len(text) + 1))[:2048], 'timestamp': 1720000000.0 + ordinal, 'metadata': {'ordinal': ordinal, 'workload': 'full20x256-v1'}})
