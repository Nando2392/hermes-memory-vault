          def read_stream(pipe, name):
              state = captures[name]
              try:
                  while True:
                      chunk = pipe.read1(16384)
                      if not chunk:
                          with lock:
                              state['eof'] = True
                          return
                      with lock:
                          remaining = stream_limit - len(state['bytes'])
                          state['bytes'].extend(chunk[:remaining])
                          if len(chunk) > remaining:
                              state['overflow'] = True
                              bad_capture.set()
              except Exception as error:
                  with lock:
                      state['error'] = str(error)[:4096]
                  bad_capture.set()
