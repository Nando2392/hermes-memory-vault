name: POSIX SQLite sandbox

on:
  workflow_dispatch:
  push:
    branches: [test/posix-sqlite-hardening]

permissions:
  contents: read

jobs:
  correctness-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [featureless, all-features]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision job-owned test scratch
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}" "${GITHUB_ENV:?GITHUB_ENV is required}"
          case "$RUNNER_TEMP$GITHUB_ENV" in
            *$'\n'*|*$'\r'*) printf 'Invalid runner path\n' >&2; exit 1 ;;
          esac
          case "$RUNNER_OS" in
            Linux) root="$RUNNER_TEMP" ;;
            Windows) root="$(cygpath -u "$RUNNER_TEMP")" ;;
            *) printf 'Unsupported runner OS\n' >&2; exit 1 ;;
          esac
          case "$root" in
            /) exit 1 ;;
            /*) ;;
            *) printf 'RUNNER_TEMP must be absolute\n' >&2; exit 1 ;;
          esac
          test -d "$root"
          test ! -L "$root"
          test -w "$root"
          test -f "$GITHUB_ENV"
          test -w "$GITHUB_ENV"
          root="$(cd -- "$root" && pwd -P)"
          scratch="$(mktemp -d "$root/hermes-tests.XXXXXXXX")"
          mkdir -- "$scratch/tmp"
          scratch="$scratch/tmp"
          if [ "$RUNNER_OS" = Windows ]; then
            scratch="$(cygpath -m "$scratch")"
          fi
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$scratch" "$scratch" "$scratch" >> "$GITHUB_ENV"
      - name: Compile once and seal exact test inventory
        run: python scripts/ci_test_shards.py build --configuration ${{ matrix.configuration }} --output capsule
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-build-proof-Linux-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: capsule-build-proof/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-capsule-Linux-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: capsule/
          if-no-files-found: error
          retention-days: 7

  correctness-shards:
    needs: correctness-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        configuration: [featureless, all-features]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Provision job-owned test scratch
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}" "${GITHUB_ENV:?GITHUB_ENV is required}"
          case "$RUNNER_TEMP$GITHUB_ENV" in
            *$'\n'*|*$'\r'*) printf 'Invalid runner path\n' >&2; exit 1 ;;
          esac
          case "$RUNNER_OS" in
            Linux) root="$RUNNER_TEMP" ;;
            Windows) root="$(cygpath -u "$RUNNER_TEMP")" ;;
            *) printf 'Unsupported runner OS\n' >&2; exit 1 ;;
          esac
          case "$root" in
            /) exit 1 ;;
            /*) ;;
            *) printf 'RUNNER_TEMP must be absolute\n' >&2; exit 1 ;;
          esac
          test -d "$root"
          test ! -L "$root"
          test -w "$root"
          test -f "$GITHUB_ENV"
          test -w "$GITHUB_ENV"
          root="$(cd -- "$root" && pwd -P)"
          scratch="$(mktemp -d "$root/hermes-tests.XXXXXXXX")"
          mkdir -- "$scratch/tmp"
          scratch="$scratch/tmp"
          if [ "$RUNNER_OS" = Windows ]; then
            scratch="$(cygpath -m "$scratch")"
          fi
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$scratch" "$scratch" "$scratch" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: test-capsule-Linux-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: capsule
      - name: Execute exact assigned tests without rebuilding
        run: python scripts/ci_test_shards.py run --configuration ${{ matrix.configuration }} --shard ${{ matrix.shard }} --capsule capsule --output receipts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-receipt-Linux-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: receipts/
          if-no-files-found: error
          retention-days: 7

  correctness-aggregate:
    if: always()
    needs: [correctness-build, correctness-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [featureless, all-features]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Provision job-owned test scratch
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}" "${GITHUB_ENV:?GITHUB_ENV is required}"
          case "$RUNNER_TEMP$GITHUB_ENV" in
            *$'\n'*|*$'\r'*) printf 'Invalid runner path\n' >&2; exit 1 ;;
          esac
          case "$RUNNER_OS" in
            Linux) root="$RUNNER_TEMP" ;;
            Windows) root="$(cygpath -u "$RUNNER_TEMP")" ;;
            *) printf 'Unsupported runner OS\n' >&2; exit 1 ;;
          esac
          case "$root" in
            /) exit 1 ;;
            /*) ;;
            *) printf 'RUNNER_TEMP must be absolute\n' >&2; exit 1 ;;
          esac
          test -d "$root"
          test ! -L "$root"
          test -w "$root"
          test -f "$GITHUB_ENV"
          test -w "$GITHUB_ENV"
          root="$(cd -- "$root" && pwd -P)"
          scratch="$(mktemp -d "$root/hermes-tests.XXXXXXXX")"
          mkdir -- "$scratch/tmp"
          scratch="$scratch/tmp"
          if [ "$RUNNER_OS" = Windows ]; then
            scratch="$(cygpath -m "$scratch")"
          fi
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$scratch" "$scratch" "$scratch" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: test-capsule-Linux-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: capsule
      - uses: actions/download-artifact@v4
        with:
          pattern: test-receipt-Linux-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: receipts
          merge-multiple: true
      - name: Require exact positive union and semantic witnesses
        run: python scripts/ci_test_shards.py aggregate --configuration ${{ matrix.configuration }} --capsule capsule --receipts receipts --output summary.json
      - name: Require successful terminal producer jobs
        env:
          BUILD_RESULT: ${{ needs.correctness-build.result }}
          SHARD_RESULT: ${{ needs.correctness-shards.result }}
        run: test "$BUILD_RESULT" = success && test "$SHARD_RESULT" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-summary-Linux-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: summary.json
          if-no-files-found: error
          retention-days: 7

  linux-regression:
    needs: correctness-aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: All original correctness and semantic gates completed
        run: echo 'Both configurations have exact positive test coverage and required semantic witnesses.'
