[package]
name = "hermes-memory"
version = "0.2.4"
edition = "2021"
license = "MIT"
description = "Local-first Rust memory data plane for Hermes Agent"

[features]
experimental-broker = []

[lib]
name = "hermes_memory"
path = "src/lib.rs"

[[bin]]
name = "hermes-memory"
path = "src/main.rs"

[[bin]]
name = "hermes-memory-broker"
path = "src/bin/hermes-memory-broker.rs"
required-features = ["experimental-broker"]

[[bin]]
name = "hermes-memory-client"
path = "src/bin/hermes-memory-client.rs"
required-features = ["experimental-broker"]

[[bin]]
name = "hermes-memory-admin"
path = "src/bin/hermes-memory-admin.rs"
required-features = ["experimental-broker"]

[[example]]
name = "windows-identity-probe"
path = "examples/windows_identity_probe.rs"
required-features = ["experimental-broker"]

[dependencies]
cap-std = "4"
cap-primitives = "4"
cap-fs-ext = "4"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Services", "Win32_System_Memory", "Win32_System_Environment", "Win32_System_IO", "Win32_System_Pipes"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"