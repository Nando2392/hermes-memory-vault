[package]
name = "hermes-memory"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Local-first Rust memory data plane for Hermes Agent"

[lib]
name = "hermes_memory"
path = "src/lib.rs"

[[bin]]
name = "hermes-memory"
path = "src/main.rs"

[dependencies]
cap-std = "4"
cap-primitives = "4"
cap-fs-ext = "4"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"